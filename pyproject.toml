[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdocs"
version = "0.1.0"
description = "Private, source-grounded document retrieval that runs locally."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David"}]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
localdocs = "localdocs.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
